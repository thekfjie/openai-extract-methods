<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>菲律宾 PHP 提链</title><style>body{margin:0;background:#f7f7fb;font:15px system-ui,"Microsoft YaHei",sans-serif;color:#17172a}.wrap{max-width:760px;margin:36px auto;padding:0 16px}.card{background:#fff;border:1px solid #e7e7ef;border-radius:18px;padding:24px;box-shadow:0 8px 32px #1616280c}h1{margin:0 0 6px}p,.hint{color:#656578}.hint{font-size:13px;margin:7px 0 0}label{display:block;font-weight:700;margin:18px 0 8px}textarea{width:100%;box-sizing:border-box;border:1px solid #d9d9e5;border-radius:10px;padding:12px;font:inherit;resize:vertical;height:145px}button{width:100%;margin-top:20px;border:0;border-radius:10px;padding:13px;background:#1759d6;color:#fff;font:700 16px inherit;cursor:pointer}button:disabled{opacity:.6}.out{display:none;margin-top:20px;padding:14px;border-radius:10px;background:#effaf4;word-break:break-all}.out.err{background:#fff1f1;color:#a32222}.meta{display:flex;gap:8px;flex-wrap:wrap}.tag{background:#edf2ff;color:#1d4cb3;border-radius:99px;padding:5px 9px;font-weight:700;font-size:12px}</style></head><body><main class="wrap"><section class="card"><h1>菲律宾 PHP 提链</h1><div class="meta"><span class="tag">PH</span><span class="tag">PHP</span><span class="tag">en-PH</span><span class="tag">官方 Checkout</span></div><p>固定菲律宾线路；无需 CDK。每位使用者自行填写 AT 与两组菲律宾出口代理。</p><label>代理池 1 - PH（Checkout）</label><textarea id="checkoutProxy" spellcheck="false" placeholder="每行一个菲律宾 Checkout 代理；支持 host:port:user:pass、user:pass@host:port 或完整 URL"></textarea><div class="hint">先用此池创建菲律宾 PHP Checkout；失败时按顺序切换下一个。</div><label>代理池 2 - PH（Promotion/优惠，可选）</label><textarea id="promotionProxy" spellcheck="false" placeholder="每行一个菲律宾 Promotion 代理；留空时沿用代理池 1"></textarea><div class="hint">创建 Checkout 后用于 Promotion 更新；批量时按任务轮换。</div><label>Access Token 或 session JSON</label><textarea id="token" spellcheck="false" placeholder="粘贴 AT 或 session JSON"></textarea><button id="go">生成菲律宾 Checkout 链接</button><div id="out" class="out"></div></section></main><script>const $=id=>document.getElementById(id),lines=id=>$(id).value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);const out=$("out");$("go").onclick=async()=>{const btn=$("go");btn.disabled=true;out.style.display="block";out.className="out";out.textContent="正在使用菲律宾两池流程生成 Checkout…";try{const r=await fetch("/api/philippines/link",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({accessToken:$("token").value.trim(),proxyPool:lines("checkoutProxy"),promotionProxyPool:lines("promotionProxy"),usePromo:true})});const d=await r.json();if(!r.ok)throw new Error(d.detail||"请求失败");out.innerHTML=`<b>菲律宾链接已生成</b><br><a href="${d.checkout_url}" target="_blank" rel="noopener">${d.checkout_url}</a><br>Checkout: ${d.checkout_id}<br>Checkout 代理尝试：${d.proxy_attempt}`;}catch(e){out.className="out err";out.textContent=e.message||String(e)}finally{btn.disabled=false}};</script></body></html>
