<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/ui/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoMyAI - 流程控制面板</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo:wght@300;400;500;600;700&family=Roboto+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <script>
      (() => {
        const allowed = ['light', 'dark-purple', 'dark-cyberpunk', 'dark-matrix', 'dark-obsidian'];
        let theme = 'dark-purple';
        try {
          const cached = localStorage.getItem('automyai-ui-theme');
          if (allowed.includes(cached)) theme = cached;
        } catch (_) {}
        if (theme !== 'light') document.documentElement.classList.add('dark', theme);
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme === 'light' ? 'light' : 'dark';
      })();
    </script>
    <script type="module" crossorigin src="/ui/assets/index-OAwGoGBA.js"></script>
    <link rel="stylesheet" crossorigin href="/ui/assets/index-XlcLnWTm.css">
  </head>
  <body>
    <div id="root"></div>
    <script src="/ui/js/runtime-config.js"></script>
  </body>
</html>
