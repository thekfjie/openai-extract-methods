    <main class="main">
      
<div class="topbar"><div><h2>邮箱与分组</h2><div class="hint">库存优先 · 域名二级兜底 · OutlookEmail 分组</div></div></div>
<div class="grid cols-2">
  <section class="card">
    <h3>分配策略试运行</h3>
    <label>平台
      <select id="platform"><option value="oai">OpenAI</option><option value="grok">Grok</option></select>
    </label>
    <div class="row">
      <button class="btn" id="allocBtn">分配一个邮箱</button>
      <button class="btn secondary" id="replanBtn">确保新分组</button>
    </div>
    <pre class="log" id="allocOut" style="margin-top:12px">—</pre>
  </section>
  <section class="card">
    <h3>生成域名邮箱（二级优先）</h3>
    <label>根域名<input id="domain" placeholder="example.com"/></label>
    <label>数量<input id="count" type="number" value="5" min="1"/></label>
    <label>本地前缀（可选）<input id="prefix" placeholder=""/></label>
    <div class="row"><button class="btn" id="genBtn">生成并入队</button></div>
    <pre class="log" id="genOut" style="margin-top:12px">—</pre>
  </section>
</div>
<section class="card" style="margin-top:16px">
  <h3>当前队列</h3>
  <div class="row" style="margin-bottom:10px"><button class="btn ghost" id="queueBtn">刷新队列</button></div>
  <pre class="log" id="queueOut">—</pre>
</section>

      <div class="footer-note">温暖、平静、亲近自然 · 凭证请妥善保管 · 仅本机管理接口</div>
    </main>
  </div>
  <script src="../js/runtime-config.js"></script>
  <script src="../js/api-client.js"></script>
  <script src="../js/app.js"></script>
  <script>
(() => {
const { api, toast } = HelpOAI;
document.getElementById('allocBtn').onclick = async ()=>{
  try{ const res=await api('POST','/email-queue/allocate',{platform:document.getElementById('platform').value,preferInventory:true}); document.getElementById('allocOut').textContent=JSON.stringify(res,null,2); toast('已分配','ok'); }
  catch(e){ toast(e.message,'error'); }
};
document.getElementById('replanBtn').onclick = async ()=>{
  try{ const res=await api('POST','/outlook-email/groups/replan',{}); document.getElementById('allocOut').textContent=JSON.stringify(res,null,2); toast('分组已确保','ok'); }
  catch(e){ toast(e.message,'error'); }
};
document.getElementById('genBtn').onclick = async ()=>{
  try{ const res=await api('POST','/email-queue/generate-domain',{domain:document.getElementById('domain').value,count:Number(document.getElementById('count').value||1),prefix:document.getElementById('prefix').value,preferSubdomain:true}); document.getElementById('genOut').textContent=JSON.stringify(res,null,2); toast('已生成','ok'); }
  catch(e){ toast(e.message,'error'); }
};
document.getElementById('queueBtn').onclick = async ()=>{
  try{ const res=await api('GET','/email-queue'); document.getElementById('queueOut').textContent=JSON.stringify(res,null,2); }
  catch(e){ toast(e.message,'error'); }
};
document.getElementById('queueBtn').click();
})();
</script>
</body>
