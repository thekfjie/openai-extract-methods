server {
    listen 443 ssl http2;
    server_name app.example.com;

    location = /card-link/ {
        root /opt/protocol-card-payment/static/neo;
        try_files /card-flow-neo.html =404;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location ^~ /card-link/neo-assets/ {
        alias /opt/protocol-card-payment/static/neo/;
        expires 1h;
    }

    location ^~ /card-link/ {
        proxy_pass http://127.0.0.1:18105;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /card-link;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
